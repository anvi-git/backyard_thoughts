<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Blog — Article</title>
  <link rel="icon" href="favicon_io/bt_logo.png" type="image/x-icon">

  <!-- Typography: Bebas Neue for titles & JetBrains Mono for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ht.css">
  <script src="blog_data.js"></script>
  <script src="archive-engine.js"></script>
  <script src="media-embeds.js"></script>
  <script src="article-engine.js"></script>
</head>
<body class="ht-body">
  <a href="#main-content" class="ht-skip-link">Skip to main content</a>

  <div id="site-header"></div>

  <!-- Main Article Layout: Centered 50% width container -->
  <main id="main-content" class="ht-article-layout">
    
    <nav class="ht-article-back-nav" aria-label="Return navigation">
      <a href="blog.html" class="ht-back-btn">
        <span aria-hidden="true">←</span>
        <span>Back to The Blog</span>
      </a>
    </nav>

    <article class="ht-single-article">
      <!-- Article Header -->
      <header class="ht-article-header">
        <div class="ht-article-eyebrow-row">
          <span class="ht-article-badge">FROM BACKYARD</span>
          <span class="ht-meta-dot" aria-hidden="true">•</span>
          <span class="ht-article-category">THE BLOG</span>
        </div>

        <h1 class="ht-article-headline" id="blog-article-title">Loading note...</h1>

        <div class="ht-article-meta-bar">
          <div class="ht-article-meta-left">
            <time id="blog-article-date" datetime=""></time>
            <span class="ht-meta-dot" aria-hidden="true">•</span>
            <span>FIELD NOTES</span>
          </div>
          <div class="ht-article-meta-share">
            <a href="https://substack.com/@backyardmagazine" target="_blank" rel="noopener noreferrer">
              Original on Substack <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </header>

      <!-- Essay body text: 50% width centered, vertical left line, drop cap on first letter -->
      <div id="blog-article-body" class="ht-article-body"></div>
    </article>

    <!-- "Read also..." Section -->
    <section class="ht-related-section" aria-labelledby="blog-related-heading">
      <div class="ht-related-header">
        <h2 id="blog-related-heading" class="ht-related-title">Read also...</h2>
        <a href="blog.html" class="ht-back-btn">View all notes <span aria-hidden="true">→</span></a>
      </div>
      <div id="blog-read-also-grid" class="ht-related-grid"></div>
    </section>

    <!-- Newsletter Callout Box -->
    <section class="ht-newsletter-box" aria-labelledby="blog-article-nl-heading">
      <div class="ht-nl-text">
        <p class="ht-nl-kicker">The Blog · Backyard</p>
        <h3 id="blog-article-nl-heading" class="ht-nl-title">Enjoyed this note?</h3>
        <p class="ht-nl-desc">Subscribe to receive future essays, poetry, and intellectual sketches delivered straight to your inbox.</p>
      </div>
      <form class="ht-nl-form" action="https://substack.com/@backyardmagazine" method="get" target="_blank" rel="noopener noreferrer">
        <div class="ht-nl-input-row">
          <input 
            type="email" 
            name="email" 
            class="ht-nl-input" 
            placeholder="Your email address..." 
            aria-label="Email address"
            required
          >
          <button type="submit" class="ht-nl-submit">Subscribe</button>
        </div>
      </form>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BackyardArticle.initArticle({
        sourceData: window.BLOG_ARTICLES,
        publicationName: 'THE BLOG',
        viewerUrl: 'blog_article.html',
        bodyContainerId: 'blog-article-body',
        titleElementId: 'blog-article-title',
        dateElementId: 'blog-article-date',
        relatedGridId: 'blog-read-also-grid'
      });
    });
  </script>
</body>
</html>
